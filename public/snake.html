<!doctype html>
<html lang="pl">
    <head>
        <meta charset="UTF-8" />
        <title>Snake multiplayer</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div id="joinLobby">
            <div id="nnick">Podaj nick:</div>
            <input type="text" placeholder="Nickname" id="nickname" /><br />
            <!--<input type="text" id="ip" placeholder="ws://0.0.0.0:0000">-->
            <button id="connect">Connect</button>

            <div id="ntryb">Sandbox</div>
            <button id="zmienTryb">Zmień tryb gry</button>
        </div>
        <div id="game">
            <canvas id="plansza"></canvas>
            <canvas id="minimapa"></canvas>
        </div>
        <div id="wynik">Wynik: </div>
        <div id="tranking">Ranking</div>
        <div id="ranking"></div>
        <div id="wiadomosci">
            <div id="chat"></div>
            <br/>
            <input type="text" placeholder="Message" id="msg" /><button id="sendMsg">send</button>
        </div>
        <button id="restart">RESTART</button>
        <button id="start">START</button>
        <div id="dtarcze"><div id="tarcze">: 0</div><img src="grafika/tarcza.png" id="otarcze"></div>
        <div id="dprzyspieszenia"><div id="przyspieszenia">: 0</div><img src="grafika/przyspieszenie.png" id="oprzyspieszenia"></div>
        <div id="dnaboje"><div id="naboje">: 0</div><img src="grafika/naboj.png" id="onaboje"></div>

        <div id="nick"></div>
        <div id="tryb"></div>

        <div id="zgracze"></div>
        <div id="ogracze"></div>

        <div id="fps"></div>
        <div id="tps"></div>
        <script src="snake2.js"></script>
    </body>
</html>
