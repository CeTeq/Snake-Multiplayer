<!doctype html>
<html lang="pl">
    <head>
        <meta charset="UTF-8" />
        <title>Snake multiplayer</title>
        <link rel="stylesheet" href="style.css" />
        <link rel="icon" type="image/png" href="grafika/ikonka.png">
    </head>
    <body onload="Ustaw()">
        <div id="joinLobby">
            <img src="grafika/tlo.png" id="tlo">
            <div id="tytul">SnakeMulti</div>
            <div id="nnick">Nickname:</div>
            <div id="ppomoc">?</div>
            <div id="pomoc">Snake control:<br> WASD or arrow keys<br><br>Actions:<br>Shield - Shift<br>Speed - Q<br>Shot - Spacebar<br><br>Additional information - E</div>
            <input type="text" placeholder="Nick" id="nickname" maxlength="12" value="Player"/><br />
            <button id="connect">Connect</button>

            <div id="ntryb">Sandbox</div>
            <button id="zmienTryb">Game Mode</button>
            <img id="ptrwaleWyniki" src="grafika/wyniki.png">
            <div id="trwaleWyniki"><span style="font-size: 20px; color: yellow;">Top length</span><br></div>
        </div>
        
        <div id="game">
            <canvas id="plansza"></canvas>
            <canvas id="minimapa"></canvas>
        </div>
        <div id="gorne">
            <div id="wynik">Wynik: </div>
            <button id="start">START</button>
        </div>
        <div id="tranking">Ranking</div>
        <div id="ranking"></div>
        <div id="wiadomosci">
            <div id="chat"></div>
            <br/>
            <input type="text" placeholder="" id="msg" /> <!--<button id="sendMsg">send</button>-->
        </div>
        <button id="restart">RESTART</button>
        
        <div id="dtarcze"><div id="tarcze">: 0</div><img src="grafika/tarcza.png" id="otarcze"></div>
        <div id="dprzyspieszenia"><div id="przyspieszenia">: 0</div><img src="grafika/przyspieszenie.png" id="oprzyspieszenia"></div>
        <div id="dnaboje"><div id="naboje">: 0</div><img src="grafika/naboj.png" id="onaboje"></div>

        <div id="nick"></div>
        <div id="tryb"></div>

        <div id="zgracze"></div>
        <div id="ogracze"></div>

        <div id="fps"></div>
        <div id="tps"></div>
        <script src="snake2.js"></script>
    </body>
</html>
